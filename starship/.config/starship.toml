
"$schema" = "https://starship.rs/config-schema.json"

palette = "catppuccin_mocha"

format = """
[](fg:surface0)\
$os\
$hostname\
[](fg:surface0 bg:#4bcce0)\
$directory\
[](fg:#4bcce0 bg:#5ca0ab)\
$git_branch\
$git_status\
[](fg:#5ca0ab bg:purple)\
$time\
[](fg:purple)\
$line_break\
$character
"""

# ─────────────────────────────────────
# Catppuccin Mocha Palette
# ─────────────────────────────────────

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo  = "#f2cdcd"
pink      = "#f5c2e7"
mauve     = "#cba6f7"
purple    = "#cba6f7"
red       = "#f38ba8"
maroon    = "#eba0ac"
peach     = "#fab387"
yellow    = "#f9e2af"
green     = "#a6e3a1"
teal      = "#94e2d5"
sky       = "#89dceb"
sapphire  = "#74c7ec"
blue      = "#89b4fa"
lavender  = "#b4befe"
text      = "#cdd6f4"
subtext1  = "#bac2de"
subtext0  = "#a6adc8"
overlay2  = "#9399b2"
overlay1  = "#7f849c"
overlay0  = "#6c7086"
surface2  = "#585b70"
surface1  = "#45475a"
surface0  = "#313244"
base      = "#1e1e2e"
mantle    = "#181825"
crust     = "#11111b"

# ─────────────────────────────────────
# Operating System
# ─────────────────────────────────────

[os]
disabled = true
style = "bg:surface0 fg:text"
format = "[ $symbol]($style)"

[os.symbols]
Arch       = "󰣇"
Artix      = "󰣇"
Debian     = "󰣚"
Fedora     = "󰣛"
Ubuntu     = "󰕈"
Manjaro    = ""
Gentoo     = "󰣨"
Mint       = "󰣭"
SUSE       = ""
Alpine     = ""
CentOS     = ""
Raspbian   = "󰐿"
Redhat     = "󱄛"
Windows    = "󰍲"
Macos      = ""
Linux      = "󰌽"

# ─────────────────────────────────────
# Username
# ─────────────────────────────────────

[username]
show_always = true
style_user = "bg:surface0 fg:text"
style_root = "bg:surface0 fg:red"
format = "[ $user ]($style)"

# ─────────────────────────────────────
# Hostname
# ─────────────────────────────────────

[hostname]
ssh_only = false
style = "bg:surface0 fg:text"
format = "[ $hostname ]($style)"

# ─────────────────────────────────────
# Directory
# ─────────────────────────────────────

[directory]
style = "fg:mantle bg:#4bcce0"
format = "[ $path ]($style)"
truncation_length = 8
truncation_symbol = "…/"

[directory.substitutions]
"Documents"   = "󰈙 "
"Downloads"   = " "
"Music"       = "󰝚 "
"Pictures"    = " "
"development" = "󰲋 "

# ─────────────────────────────────────
# Git
# ─────────────────────────────────────

[git_branch]
symbol = ""
style = "fg:base bg:#5ca0ab"
format = "[ $symbol $branch ]($style)"

[git_status]
style = "fg:base bg:#5ca0ab"
format = "[$all_status$ahead_behind]($style)"

# ─────────────────────────────────────
# Time
# ─────────────────────────────────────

[time]
disabled = false
time_format = "%I:%M %p"
style = "fg:mantle bg:purple"
format = "[  $time ]($style)"

# ─────────────────────────────────────
# Line Break
# ─────────────────────────────────────

[line_break]
disabled = false

# ─────────────────────────────────────
# Prompt Character
# ─────────────────────────────────────

[character]
disabled = false
success_symbol = "[](bold fg:green)"
error_symbol = "[](bold fg:red)"
vimcmd_symbol = "[](bold fg:green)"
vimcmd_replace_one_symbol = "[](bold fg:purple)"
vimcmd_replace_symbol = "[](bold fg:purple)"
vimcmd_visual_symbol = "[](bold fg:lavender)"


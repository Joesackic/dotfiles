background {
    monitor =
    path = screenshot
    blur_size = 8
    blur_passes = 3
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    position = 0, -100
    dots_center = true
    halign = center
    valign = center
    outline thickness = 3
}

# Date

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%A, %B %d")"
    color = rgba(255, 255, 255, 1.0)
    font_size = 30
    font_family = JetBrains Mono Nerd Font
    position = 0, 70
    halign = center
    valign = center
}

#Time

label {
    monitor = 
    text = $TIME
    color = rgb(255, 255, 255, 1.0)
    font_size = 60
    font_family = JetBrains Mono Nerd Font 
    position = 0, 0
    halign = center
    valign = center
}
